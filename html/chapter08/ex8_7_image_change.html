<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        aside {
            display: flex;
            flex-direction: column;
            flex-wrap: nowrap;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .banner {
            width: 150px;
            height: 150px;

            box-shadow: 10px 5px 5px #ccc;

        }
    </style>
    <script>
        function onLoad() {
            //객체 찾기
            const img = document.querySelector('img');
            const button = document.querySelector('button');
            //이벤트 리스너 등록
            button.addEventListener("click", imgChange);

            function imgChange() {
                let num = Math.floor(Math.random() * (3 - 1 + 1) + 1);
                let srcData = `./../chapter06/media/food${num}.png`;
                img.src = srcData;

            }
        }
    </script>
</head>

<body onload="onLoad();">
    <aside>
        <div class="banner">
            <a href="#"><img src="./../chapter06/media/food1.png" alt=""></a><br>
            <button type="button">change</button>
        </div>

    </aside>
</body>

</html>
